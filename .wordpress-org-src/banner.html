<!doctype html>
<html><head><meta charset="utf-8"><title>Banner</title>
<style>
@font-face { font-family: Inter; src: url(https://cdn.jsdelivr.net/npm/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
@font-face { font-family: Fraunces; src: url(https://cdn.jsdelivr.net/npm/@fontsource-variable/fraunces/files/fraunces-latin-wght-normal.woff2) format('woff2'); font-weight: 100 900; }
:root { --red: #A63A2B; --deep: #7E2A1F; --ochre: #E0A33A; --laurel: #2F6B4F; --parchment: #F7F1E6; --ink: #1F1A17; }
* { box-sizing: border-box; margin: 0; }
html, body { width: 772px; height: 250px; overflow: hidden; background: var(--red); font-family: Inter, sans-serif; }
.sun { position: absolute; left: 430px; top: 40px; width: 560px; height: 560px; border-radius: 50%; background: var(--deep); }
.copy { position: absolute; left: 48px; top: 0; height: 250px; display: flex; flex-direction: column; justify-content: center; }
.logo { display: flex; align-items: center; gap: 14px; }
.logo img { width: 52px; height: 52px; border-radius: 12px; box-shadow: 0 0 0 2px rgba(247,241,230,.35); }
h1 { color: var(--parchment); font-family: Fraunces, Georgia, serif; font-weight: 700; font-size: 54px; letter-spacing: -1px; line-height: 1; }
.kicker { margin-top: 14px; color: var(--parchment); font-size: 11px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; }
.kicker b { color: var(--ochre); font-weight: 800; }
p { margin-top: 10px; color: #fff; font-size: 16px; line-height: 22px; font-weight: 600; width: 310px; }
.card { position: absolute; right: 44px; top: 34px; width: 300px; background: var(--parchment); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.28); padding: 14px; transform: rotate(-3deg); }
.card h3 { font-family: Fraunces, Georgia, serif; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 8px; }
.grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
.grid span { height: 22px; border-radius: 3px; background: #EDE3D1; font-size: 8px; color: #5E5149; padding: 2px 3px; }
.grid span.e { background: var(--ochre); color: var(--ink); font-weight: 700; }
.grid span.m { background: var(--red); color: #fff; font-weight: 700; }
.grid span.g { background: var(--laurel); color: #fff; font-weight: 700; }
.ticket { position: absolute; right: 250px; bottom: 26px; background: var(--ochre); color: var(--ink); border-radius: 8px; padding: 8px 12px; font-size: 11px; font-weight: 800; box-shadow: 0 8px 18px rgba(0,0,0,.25); transform: rotate(4deg); }
</style></head>
<body>
<div class="sun"></div>
<div class="copy">
	<div class="logo"><img src="mark.svg" alt=""><h1>Feriae</h1></div>
	<div class="kicker">Calendar <b>·</b> RSVP <b>·</b> Tickets</div>
	<p>Open-source events for WordPress. Fast at any size, no upsells.</p>
</div>
<div class="card">
	<h3>October</h3>
	<div class="grid">
		<span>28</span><span>29</span><span>30</span><span>1</span><span>2</span><span class="m">3</span><span>4</span>
		<span>5</span><span>6</span><span>7</span><span class="e">8</span><span>9</span><span>10</span><span>11</span>
		<span class="g">12</span><span class="g">13</span><span class="g">14</span><span>15</span><span class="e">16</span><span>17</span><span>18</span>
		<span>19</span><span class="g">20</span><span>21</span><span>22</span><span>23</span><span>24</span><span class="m">25</span>
	</div>
</div>
<div class="ticket">✓ You're going</div>
</body></html>
